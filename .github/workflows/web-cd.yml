name: Web CD

on:
  pull_request:
  push:
    branches:
      - master-web
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  WEB_PROJECT: PlotDigitizer.Web/PlotDigitizer.Web.csproj

permissions:
  contents: read

jobs:
  publish-web:
    name: Build web deployment artifact
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish web project
        run: >-
          dotnet publish ${{ env.WEB_PROJECT }}
          --configuration Release
          --runtime win-x86
          --self-contained false
          --output ${{ github.workspace }}/web-publish

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: web-publish
          if-no-files-found: error

  deploy-web:
    name: Deploy web application
    needs: publish-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/master-web'
    runs-on: windows-latest
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-publish
          path: web-publish

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: web-publish
