name: CI

on:
  pull_request:
  push:
    branches:
      - master-wpf
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  TEST_PROJECT: PlotDigitizer.Core.Test/PlotDigitizer.Core.Test.csproj

permissions:
  contents: read

jobs:
  test:
    name: Core Tests 
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build Core
        run: dotnet build PlotDigitizer.Core/PlotDigitizer.Core.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Run Core tests
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-restore --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

