name: WPF UI Tests

on:
  pull_request:
  push:
    branches:
      - master-wpf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore UI tests
        run: dotnet restore PlotDigitizer.WPF.Test/PlotDigitizer.WPF.Test.csproj

      - name: Build UI tests
        run: dotnet build PlotDigitizer.WPF.Test/PlotDigitizer.WPF.Test.csproj --configuration Release --no-restore

      - name: Run WPF UI tests
        run: >
          dotnet test PlotDigitizer.WPF.Test/PlotDigitizer.WPF.Test.csproj
          --configuration Release
          --no-restore
          --no-build
          --filter "TestCategory=UI"
          --logger "trx;LogFileName=wpf-ui-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-ui-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore